  med_nan_frac: 0.40
  med_zero_frac: 0.60
  med_flatline_ratio: 0.92
  med_jump_count_gt25: 10
  med_max_abs_jump: 30.0
interpolation:
  max_gap_samples_to_fill: 10
  fill_method: linear
  do_not_fill_if_gap_too_large: true
