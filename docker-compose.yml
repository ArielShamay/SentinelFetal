# SentinelFetal Docker Compose
# Full-stack deployment with backend and frontend services

version: '3.8'

services:
  # ===========================================================================
  # Backend - FastAPI + WebSocket Server
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinelfetal-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PATIENT_COUNT=${PATIENT_COUNT:-10}
      - SPEED_MULTIPLIER=${SPEED_MULTIPLIER:-1.0}
    volumes:
      # Mount data directory for persistence (optional)
      - ./data:/app/data:ro
      # Mount models directory
      - ./models:/app/models:ro
    ports:
      - "8000:8000"  # Expose for direct access during development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sentinelfetal-network

  # ===========================================================================
  # Frontend - Nginx + React SPA
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinelfetal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentinelfetal-network

networks:
  sentinelfetal-network:
    driver: bridge

# Optional: Named volumes for data persistence
# volumes:
#   sentinelfetal-data:
