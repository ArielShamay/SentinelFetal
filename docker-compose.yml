version: '3.8'

services:
  sentinelfetal:
    build: .
    container_name: sentinelfetal-champions
    ports:
      - "8080:80"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./logs:/var/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s